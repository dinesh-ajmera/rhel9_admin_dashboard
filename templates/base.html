<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} - RHEL 9 Admin</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f1f4f6; color: #1b2530; }
    header { background: #16202a; padding: .8rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
    header a, header button { color: #dfe7ee; text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
    header strong { color: #fff; }
    header .spacer { margin-left: auto; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: #fff; border: 1px solid #d6dce2; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #e3e8ec; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; }
    input, select, button.btn { font: inherit; padding: .4rem .6rem; margin: .2rem .2rem .2rem 0; }
    input[type=password], input[name=value], input[name=comment] { min-width: 15rem; }
    h1, h2 { margin-top: 0; }
    button.btn { background: #0c6b73; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .flash { padding: .6rem 1rem; border-radius: 6px; margin-bottom: .6rem; }
    .flash.ok { background: #e2f3ea; color: #14532f; }
    .flash.error { background: #fbe3e0; color: #7a1a12; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .stat { text-decoration: none; color: inherit; margin: 0; }
    .stat:hover { border-color: #0c6b73; }
    .stat .num { font-size: 3.2rem; font-weight: 700; color: #0c6b73; line-height: 1.1; }
    .muted { color: #5a6877; }
  </style>
</head>
<body>
{% if session.logged_in %}
<header>
  <strong>RHEL 9 Admin</strong>
  <a href="{{ url_for('home') }}">Home</a>
  <a href="{{ url_for('users') }}">Users</a>
  <a href="{{ url_for('groups') }}">Groups</a>
  <form class="spacer" method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Sign out</button>
  </form>
</header>
{% endif %}
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
