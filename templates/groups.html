{% extends "base.html" %}
{% block title %}Groups{% endblock %}
{% block content %}
<div class="card"><h1>Groups</h1>
  <table>
    <tr><th>Name</th><th>GID</th><th>Members</th></tr>
    {% for g in groups %}
    <tr><td><b>{{ g.name }}</b></td><td>{{ g.gid }}</td><td>{{ g.members|join(", ") or "none" }}</td></tr>
    {% else %}<tr><td colspan="3" class="muted">No regular groups yet.</td></tr>{% endfor %}
  </table>
</div>

<form method="post" class="card">
  <h2>Add group</h2>
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="add">
  <input name="name" placeholder="group name" pattern="[a-z_][a-z0-9_\-]{0,31}" required>
  <button class="btn" type="submit">Create group</button>
</form>

<form method="post" class="card">
  <h2>Change a group</h2>
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="change">
  <select name="name" required>{% for g in groups %}<option>{{ g.name }}</option>{% endfor %}</select>
  <select name="field">
    <option value="add-user">add a user</option><option value="remove-user">remove a user</option><option value="rename">rename group</option>
  </select>
  <input name="value" placeholder="user name, or the new group name" required>
  <button class="btn" type="submit">Apply</button>
</form>
{% endblock %}
