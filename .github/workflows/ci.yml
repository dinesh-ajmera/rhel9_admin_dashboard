name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flask
        run: pip install -r requirements.txt

      - name: Check Bash syntax
        run: for f in bash_scripts/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Bash tests (creates and deletes a throw-away user and group)
        run: sudo bash tests/run_tests.sh

      - name: Python tests
        run: python -m unittest discover -s tests -v
